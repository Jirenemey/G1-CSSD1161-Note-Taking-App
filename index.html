<!DOCTYPE html> 
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Note taking Web</title>
        <link rel="stylesheet" href="style.css">
        <script src="java.js" defer></script> 
        <!-- defer use to executed after the HTML is fully loaded -->

    </head>
    <body>
        <header>
            <h1>Quick Notes</h1>
            <div>
            <button id="add-note-btn" onclick="openNoteDialog()">+ Add note</button>
            <button id="themeToggleBtn" class="theme-toggle-btn"> 🌙 </button>
            </div>
            <div class="search-container">
                <input type="search" id="searchInput" class="search-input" placeholder="🔍 Search your notes..." aria-label="Search notes">
            </div>
        </header>

        <main id="notesContainer" class="notes-grid">

        </main>

        <dialog id="noteDialog">
            <div class="dialog-content">
                <div class="dialog-header">
                    <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                    <button class="close-btn" onclick="closeNoteDialog()">X</button>
                </div>
                <form id="noteForm">

                    <div class="form-group">
                        <label for="noteTitle">Title:</label>
                        <input type="text" id="noteTitle" class="form-input" placeholder="Enter note title" required>
                    </div>

                    <div class="form-group">
                        <label for="noteContent">Content:</label>
                        <textarea id="noteContent" class="form-textarea" placeholder="Enter note content" required></textarea>
                    </div>

                    <div class="Dialog-actions">
                        <button type="button" onclick="closeNoteDialog()" class="cancel-btn">Cancel</button>
                        <button type="submit" class="save-btn">Save Note</button>
                    </div>
                </form>
            </div>
        </dialog>

    </body>
</html>
